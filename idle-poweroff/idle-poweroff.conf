# /etc/idle-poweroff.conf — this machine's settings for idle-poweroff.
# Written once on the first install and never overwritten, so it is yours.

# Apply changes with: sudo systemctl restart idle-poweroff.timer
# See what it thinks right now with: b-idle

# Turn it off here rather than masking the timer — this survives a re-install.
#ENABLED=false

# Idle limit for an unlocked desktop and the login window.
#IDLE_MINUTES=60

# Idle limit with no screen at all — a headless box, or one whose monitor never
# logged anybody in. Nobody can be sitting at it, so it need not wait the hour.
#HEADLESS_MINUTES=10

# Once the screen is LOCKED the human has said they are leaving, so it is shorter.
#LOCKED_MINUTES=10

# Grace period between the warning and the poweroff; any activity cancels it.
#WARN_SECONDS=120

# The machine never powers off within this long of a boot, whatever the checks
# say. It is woken by Wake-on-LAN and by the BIOS after a blackout, and a
# headless wake that powered off again before you could connect would leave you
# with a machine you cannot reach. Give yourself time to log in.
#MIN_UPTIME_MINUTES=15

# 1-min load average that counts as busy. Absolute, not per-core: an idle Linux
# box sits near 0.00 whatever its cores. Raise it if background chatter trips it.
#MAX_LOAD=0.5

# Process names that mean "the screen is locked", tried in order.
#LOCKERS="i3lock swaylock xsecurelock slock xtrlock"

# Keep true on anything reached over the network, or a headless box powers off
# underneath an ssh session that is merely quiet.
#BLOCK_ON_LOGIN_SESSIONS=true

# A connected ssh client stops the poweroff outright, however quiet it is: an
# open shell, a long build, an scp or a port forward is someone using the box.
# Set false only on a machine something keeps a permanent ssh link to, which
# would otherwise never turn off.
#BLOCK_ON_SSH=true

# How long the machine stays up after the LAST ssh connection closed. A desktop
# or a login screen counts its idle time in X, which logging out of ssh does not
# touch, so without this the machine can power off a couple of minutes after you
# type `exit`. 0 turns the grace period off.
#SSH_GRACE_MINUTES=10

# Ports to look for ssh connections on. Only used when the sshd listener cannot
# be read out of `ss` — normally the port is found on its own, whatever it is.
#SSH_PORTS=22

# A film, a video call or music stops the poweroff for as long as it plays. The
# test is the sound card: PipeWire and PulseAudio alike report a sink as RUNNING
# only while something is actually feeding it, so this needs no list of players.
# Set false if this machine holds a sink open permanently (a loopback, a virtual
# cable), which would otherwise keep it awake for good.
#BLOCK_ON_MEDIA=true

# A running coding agent stops it too. This is the case the load average cannot
# catch: an agent waiting on its API uses no CPU at all, for minutes at a time,
# and powering off under it throws away whatever it was doing.
#BLOCK_ON_AGENT=true

# Process names that count as an agent. Matched whole, so `claude` is the binary
# and never a file called claude-something open in an editor.
#AGENTS="claude opencode codex aider crush goose"

# ...but only until it has printed nothing for this long. An agent waiting for
# YOU to type is not working, and should not keep the machine up all night; an
# agent that IS working prints something. Set 0 to go back to "any running agent
# blocks for ever".
# Careful: a full-screen agent that redraws its status bar is never silent, so
# for that one this expiry never fires. `b-idle` tells you which yours is.
#AGENT_SILENT_MINUTES=20

# So does tmux or screen with a pane running something that is not just a shell
# prompt waiting for you. An idle prompt does not count: that is a window you
# forgot about, not work in progress. There is deliberately no "a client is
# attached" rule — attached over ssh is already covered by ssh, attached at the
# machine itself by the X idle timer, and blocking on attachment too would mean
# a desktop with a tmux window open could never power off at all.
#BLOCK_ON_MUX=true

# And the same silence rule for a tmux pane: a job that is working prints
# something. 0 turns the expiry off, so any non-shell pane blocks for ever.
# screen is the exception — it will not report its windows' ttys, so there is no
# silence to measure there and an attached screen session blocks regardless.
#MUX_SILENT_MINUTES=20

# Pane commands that read as "an idle prompt" rather than "a job you left going".
#MUX_IDLE_SHELLS="bash zsh sh fish dash ksh tmux screen"

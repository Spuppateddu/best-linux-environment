# Installed by best-linux-environment (advanced/magic-trackpad.sh) — edits here
# are overwritten by ./setup.sh. Change magic-trackpad/ in the repo instead.
#
# Classic scrolling on the Apple Magic Trackpad: fingers up scrolls up, like a
# mouse wheel. libinput turns natural scrolling ON by default for Apple
# trackpads only, so without this file the trackpad scrolls the other way from
# every other device. Every Magic Trackpad model matches "Magic Trackpad".
Section "InputClass"
    Identifier      "Apple Magic Trackpad"
    MatchProduct    "Magic Trackpad"
    MatchDevicePath "/dev/input/event*"
    Option          "NaturalScrolling" "false"
EndSection

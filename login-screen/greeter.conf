# The login screen. basic/30-lightdm.sh installs it as
# /etc/xdg/lightdm/lightdm-gtk-greeter.conf.d/50-ble.conf; edit here, re-run ./setup.sh.
[greeter]
background=/usr/share/backgrounds/ble-login.jpg
user-background=false
theme-name=BLE-Retro
hide-user-image=true
position=50%,center 50%,center
panel-position=top
indicators=~host;~spacer;~session;~layout;~clock;~power
clock-format=%H:%M

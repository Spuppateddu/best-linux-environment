# tier|id|scope|check|actions|label — move a line to another tier to change how
# you are asked. Order within a tier is install order. See README.md § three tiers.


# ── NECESSARY ─ substrate ──────────────────────────────────────────────────────
# Not optional and not asked. To drop one, delete the line — don't move its tier.
necessary|git|all|cmd:git|apt:git|git — version control, and how every repo here arrives
necessary|curl|all|cmd:curl|apt:curl|curl — fetches every release tarball and apt key below
necessary|wget|all|cmd:wget|apt:wget|wget — the other downloader some upstream installers expect
necessary|archives|all|cmd:unzip|apt:unzip xz-utils|unzip, xz-utils — unpack what was just downloaded
necessary|certs|all|apt:ca-certificates|apt:ca-certificates gnupg|ca-certificates, gnupg — verify apt repos and signed downloads
necessary|build|all|cmd:gcc|apt:build-essential pkg-config|build-essential, pkg-config — compile native bits (vim plugins, ueberzugpp deps)
necessary|zsh|all|cmd:zsh|apt:zsh|zsh — installed either way; whether it's your LOGIN shell is the one question asked before the lists (bash is the alternative, and needs no package)
necessary|cron|all|cmd:crontab|apt:cron|cron — runs ./boot.sh at every boot
necessary|apt-tools|all|cmd:add-apt-repository|apt:software-properties-common|software-properties-common — add-apt-repository, needed by Steam and others
necessary|ssh|all|cmd:ssh|apt:openssh-client+run:basic/20-ssh.sh|openssh-client + a default ed25519 key — connects OUT only, opens no port

# ── NECESSARY ─ what the core repos need in order to work ──────────────────────
# Each line here exists because a config repo in the 'core' tier names it.
necessary|lazygit|all|cmd:lazygit|run:basic/40-lazygit.sh|lazygit — git TUI; the zshrc and the tmux config both call it
necessary|yazi|all|cmd:yazi|run:basic/55-yazi.sh|yazi + fzf + zoxide + image preview — the zshrc calls yazi
necessary|fonts|gui|-|run:basic/50-fonts-cursor.sh|Nerd Fonts, colour emoji, cursor theme — alacritty and i3 render these glyphs
necessary|alacritty-pkg|gui|cmd:alacritty|run:basic/52-alacritty.sh|Alacritty — the terminal i3 binds $mod+Return to
necessary|lightdm|gui|apt:lightdm|run:basic/30-lightdm.sh|LightDM + GTK greeter — the login screen that lets you choose the i3 session
necessary|firefox|gui|cmd:firefox|run:basic/70-firefox.sh|Firefox (deb, not snap) — the browser itself; i3 binds a key to it. Its config is the 'firefox-config' core repo
necessary|flameshot|gui|cmd:flameshot|run:basic/60-flameshot.sh|Flameshot — screenshots, bound in the i3 config
necessary|arandr|gui|cmd:arandr|run:basic/80-arandr.sh|ARandR — arrange displays

# ── CORE ─ the config repos ────────────────────────────────────────────────────
# All pre-ticked. zsh-config and bash-config are one slot: only the shell you picked.
core|zsh-config|all|link:~/.zsh|tool:zsh|zsh — prompt, aliases, keybindings                      (~/.zsh)
core|bash-config|all|link:~/.bash|tool:bash|bash — prompt, aliases, keybindings (no framework)      (~/.bash)
core|vim|all|link:~/.vim|tool:vim|vim — plugins, LSP, per-language support               (~/.vim)
core|tmux|all|link:~/.tmuxrc|tool:tmux|tmux — keybindings, status line, agent scripts        (~/.tmuxrc)
core|temps|all|cmd:temps|tool:temperature-logger+run:basic/15-temps-alias.sh|temps — CPU/GPU temperature logger, aliased b-temp in your shell (~/.temps)
core|alacritty|gui|link:~/.alacritty|tool:alacritty|alacritty — colours, font, padding                    (~/.alacritty)
core|i3|gui|link:~/.i3rc|tool:i3|i3 — window manager, rofi, dunst, picom, eww          (~/.i3rc)
core|firefox-config|gui|link:~/.firefox|tool:firefox|firefox — prefs, add-ons, Vimium, browser keybindings   (~/.firefox)

# ── SECONDARY ─ extra applications ─────────────────────────────────────────────
# Nothing pre-ticked. opencode uses `script`: its binary is not on PATH.
secondary|opencode|all|script|run:basic/90-opencode.sh|opencode — terminal AI coding agent (pipes opencode.ai/install into bash)
secondary|sshd|all|apt:openssh-server|run:advanced/openssh-server.sh|OpenSSH server — opens port 22 so other machines can connect IN to this one
secondary|docker|all|script|run:advanced/docker.sh|Docker Engine + Compose plugin
secondary|lazydocker|all|script|run:advanced/lazydocker.sh|lazydocker — Docker TUI
secondary|brave|gui|script|run:advanced/brave.sh|Brave — Chromium-based browser
secondary|steam|gui|script|run:advanced/steam.sh|Steam — games
secondary|tableplus|gui|script|run:advanced/tableplus.sh|TablePlus — database GUI
secondary|okular|gui|script|run:advanced/okular.sh|Okular — PDF reader
secondary|xournalpp|gui|script|run:advanced/xournalpp.sh|Xournal++ — annotate and sign PDFs
secondary|megasync|gui|script|run:advanced/megasync.sh|MEGAsync — cloud sync
